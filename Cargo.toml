[package]
name = "qiuchenly-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "qiuchenly"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.13", features = ["json", "query", "rustls"], default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "7"
base64 = "0.23"
sha2 = "0.11"
rsa = "0.10"
rand = "0.10"
libc = "0.2"
plist = "1"
rpassword = "7"
tempfile = "3"
walkdir = "2"
regex = "1.13"
globset = "0.4"
percent-encoding = "2"
version-compare = "0.2"
goblin = "0.10"
dialoguer = { version = "0.12", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
strip = true
lto = true
