name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/check.yml

  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-26-intel
            target: x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-cache-${{ matrix.target }}
          cache-on-failure: true

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="${GITHUB_SHA::7}"
          fi
          mkdir -p dist
          tar -czf "dist/qiuchenly-${version}-${TARGET}.tar.gz" -C "target/${TARGET}/release" qiuchenly -C "$GITHUB_WORKSPACE" README.md

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          path: dist/*.tar.gz
          archive: false
          if-no-files-found: error

  nix:
    name: Build Nix Package (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            system: x86_64-linux
          - platform: ubuntu-24.04-arm
            system: aarch64-linux
          - platform: macos-latest
            system: aarch64-darwin

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Use and populate the mzwing cache
        uses: cachix/cachix-action@v17
        with:
          name: mzwing
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.event_name == 'pull_request' }}

      - name: Build
        run: nix build .#packages.${{ matrix.system }}.default --print-build-logs

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, nix, checks]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
          skip-decompress: true

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.tar.gz
          fail_on_unmatched_files: true
          generate_release_notes: true
